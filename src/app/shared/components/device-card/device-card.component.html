<div class="device-card">
  <div class="device-card-head">
    <div class="device-card-cover">
      <img [src]="deviceIcon()" [alt]="deviceName()" class="device-card-img" />
    </div>
    <h3 class="device-card-name">{{ deviceName() }}</h3>
  </div>
  <div class="device-card-footer">
    <span class="device-card-description">{{ deviceDescription() }}</span>
  </div>
</div>
