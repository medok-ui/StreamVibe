<app-header />

<main class="main">
  <section class="hero-section" aria-label="Featured Movie">
    <div class="container">
      <div
        class="hero-movie"
        [style.background-image]="
          `
           linear-gradient(to top, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0) 40%),
           linear-gradient(to bottom, rgba(0, 0, 0, 0.6) 0%, rgba(0, 0, 0, 0) 30%),
           url(${currentMovie().img})
          `
        "
      >
        <div class="hero-grid">
          <div class="hero-movie-content">
            <h1 class="hero-movie-title">{{ currentMovie().title }}</h1>
            <p class="hero-movie-description">{{ currentMovie().description }}</p>

            <div class="hero-movie-buttons">
              <a [href]="currentMovie().link" target="_blank" rel="noopener">
                <button appRedButton class="movie-play">
                  <img src="/assets/svg/play.svg" alt="play" aria-hidden="true" />
                  <span>Play Now</span>
                </button>
              </a>
              <button class="movie-btn" aria-label="Add to My List">
                <img src="/assets/svg/plus.svg" alt="plus" aria-hidden="true" />
              </button>
              <button class="movie-btn" aria-label="Like">
                <img src="/assets/svg/like.svg" alt="like" aria-hidden="true" />
              </button>
              <button class="movie-btn" aria-label="Toggle Sound">
                <img src="/assets/svg/sound.svg" alt="sound" aria-hidden="true" />
              </button>
            </div>
          </div>

          <div class="hero-movie-control">
            <button (click)="onPrev()" class="hero-movie-swap" aria-label="Previous slide">
              <img src="/assets/svg/arrow-left.svg" alt="" aria-hidden="true" />
            </button>

            <ul class="indicator-item" role="tablist">
              @for (step of steps(); track $index) {
                <li
                  class="indicator"
                  [class.active]="currentStep() === step"
                  role="presentation"
                ></li>
              }
            </ul>

            <button (click)="onNext()" class="hero-movie-swap" aria-label="Next slide">
              <img src="/assets/svg/arrow-right.svg" alt="" aria-hidden="true" />
            </button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="movie-section container">
    <header class="section-header">
      <span class="section-label">Movies</span>
    </header>

    <div class="section-content">
      <app-films-section filmsTitleSection="Our Genres" filmsCategorySection="default" />

      <app-films-section
        filmsTitleSection="Popular Top 10 In Genres"
        filmsCategorySection="default"
      />

      <app-films-section filmsTitleSection="Trending Now" filmsCategorySection="trending-now" />
      <app-films-section filmsTitleSection="New Releases" filmsCategorySection="new-releases" />
      <app-films-section
        filmsTitleSection="Must - Watch Movies"
        filmsCategorySection="recommendation"
      />
    </div>
  </section>

  <section class="shows-section container">
    <header class="section-header">
      <span class="section-label">Shows</span>
    </header>

    <div class="section-content">
      <app-films-section
        filmsTitleSection="Popular Top 10 In Genres"
        filmsCategorySection="default"
      />

      <app-films-section
        filmsTitleSection="Trending Shows Now"
        filmsCategorySection="trending-shows"
      />

      <app-films-section
        filmsTitleSection="New Released Shows"
        filmsCategorySection="new-release-shows"
      />
    </div>
  </section>
  <app-cta-section />
</main>

<app-footer />
